name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Lint (SwiftLint; settings in .swiftlint.yml)
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --quiet
      - name: Build and test (SwiftPM)
        run: swift test
